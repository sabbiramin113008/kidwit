name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        shell: bash
        run: python -m unittest discover -s tests -t . 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
      - name: Show test failures as annotations
        if: failure()
        shell: python
        run: |
          import urllib.parse
          import subprocess, sys
          text = open("test-output.txt", encoding="utf-8", errors="replace").read()[-20000:]
          text += "\n=== eval selftest ===\n" + subprocess.run([sys.executable, "evals/run_evals.py", "--selftest"], capture_output=True, text=True).stdout[-8000:]
          print("::error title=test output::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
      - name: Check the eval tasks themselves
        run: python evals/run_evals.py --selftest

  check:
    name: standard library only, size ceiling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: scripts/check.sh

  package:
    name: build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
